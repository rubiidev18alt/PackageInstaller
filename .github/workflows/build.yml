name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK root: $SDK_ROOT"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" >/dev/null 2>&1 || true
          else
            echo "sdkmanager not found; relying on preinstalled SDK + AGP auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShellInstaller.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellInstaller-apk
          path: ShellInstaller.apk
          if-no-files-found: error

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly ShellInstaller.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Shell Installer — automated build" \
            --notes "Automated debug build of ${GITHUB_SHA::7}. Install this APK, then set up Shizuku or Wireless ADB inside the app. See the README for setup instructions."
