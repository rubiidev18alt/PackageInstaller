name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShellInstaller.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellInstaller-apk
          path: ShellInstaller.apk
          if-no-files-found: error

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly ShellInstaller.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Shell Installer — automated build" \
            --notes "Automated debug build of ${GITHUB_SHA::7}. Install this APK, then set up Shizuku or Wireless ADB inside the app. See the README for setup instructions."
